<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Admin Panel • turkkedy.net</title>

  <!-- Perf: warm up connection to image CDN -->
  <link rel="preconnect" href="https://medias.turkkedy.net" crossorigin>
  <link rel="dns-prefetch" href="https://medias.turkkedy.net">

  <style>
    :root { --bg:#0f1115; --fg:#e6e6e6; --muted:#9aa0a6; --btn:#1f232b; --btnh:#2a2f3a; --success:#06d6a0; --warning:#ffd166; --error:#f77f00; }
    * { box-sizing: border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #2b2f38;
    }
    
    .header h1 {
      margin: 0;
      font-size: 28px;
      color: var(--fg);
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: var(--btn);
      border: 1px solid #2b2f38;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    
    .stat-number {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .stat-label {
      color: var(--muted);
      font-size: 14px;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }

    .tabs {
      display: flex;
      gap: 5px;
      background: var(--btn);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab-button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      flex: 1;
    }

    .tab-button.active {
      background: var(--success);
      color: #000;
    }

    .tab-button:hover:not(.active) {
      background: var(--btnh);
      color: var(--fg);
    }
    
    button {
      background: var(--btn);
      color: var(--fg);
      border: 1px solid #2b2f38;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    
    button:hover { background: var(--btnh); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .btn-success { background: var(--success); color: #000; }
    .btn-success:hover { background: #05b88a; }
    
    .btn-warning { background: var(--warning); color: #000; }
    .btn-warning:hover { background: #e6bc5a; }
    
    .btn-error { background: var(--error); color: #fff; }
    .btn-error:hover { background: #e66f00; }
    
    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .images-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .image-list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: var(--btn);
      border: 1px solid #2b2f38;
      border-radius: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .image-list-item:hover {
      border-color: var(--muted);
      background: var(--btnh);
    }

    .image-list-preview {
      width: 100px;
      height: 70px;
      object-fit: cover;
      border-radius: 4px;
      background: #1a1a1a;
      flex-shrink: 0;
    }

    .image-list-info {
      flex: 1;
      min-width: 0;
    }

    .image-list-filename {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
      word-break: break-all;
    }

    .image-list-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .pagination button {
      padding: 6px 12px;
      min-width: 40px;
      font-size: 14px;
    }

    .pagination-info {
      font-size: 14px;
      color: var(--muted);
      margin: 0 16px;
    }
    
    .image-card {
      background: var(--btn);
      border: 1px solid #2b2f38;
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    
    .image-card:hover {
      border-color: var(--muted);
      transform: translateY(-2px);
    }
    
    .image-preview {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #1a1a1a;
    }
    
    .image-info {
      padding: 15px;
    }
    
    .image-filename {
      font-weight: 600;
      margin-bottom: 8px;
      word-break: break-all;
    }
    
    .image-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    
    .confidence-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .confidence-high { background: rgba(6,214,160,0.2); color: var(--success); }
    .confidence-medium { background: rgba(255,209,102,0.2); color: var(--warning); }
    .confidence-low { background: rgba(247,127,0,0.2); color: var(--error); }

    .manifest-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .manifest-live { background: rgba(6,214,160,0.2); color: var(--success); }
    .manifest-not-live { background: rgba(247,127,0,0.2); color: var(--error); }
    
    .image-actions {
      display: flex;
      gap: 8px;
    }
    
    .image-actions button {
      flex: 1;
      padding: 8px 12px;
      font-size: 12px;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
    
    .error {
      background: rgba(247,127,0,0.1);
      border: 1px solid var(--error);
      border-radius: 6px;
      padding: 15px;
      margin: 20px 0;
      color: var(--error);
    }
    
    .success {
      background: rgba(6,214,160,0.1);
      border: 1px solid var(--success);
      border-radius: 6px;
      padding: 15px;
      margin: 20px 0;
      color: var(--success);
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }
      
      .images-grid {
        grid-template-columns: 1fr;
      }
      
      .controls {
        flex-direction: column;
      }
      
      .controls button {
        width: 100%;
      }
    }
    
    /* Image Modal Styles */
    .image-modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.9);
      backdrop-filter: blur(4px);
    }
    
    .image-modal-content {
      position: relative;
      margin: auto;
      padding: 20px;
      width: 90%;
      height: 90%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .image-modal img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    .image-modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 2001;
      background: rgba(0,0,0,0.5);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    .image-modal-close:hover {
      background: rgba(0,0,0,0.8);
      transform: scale(1.1);
    }
    
    .image-modal-info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 15px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }
    
    .image-modal-filename {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    
    .image-modal-meta {
      font-size: 14px;
      color: #ccc;
    }
    
    .image-card {
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    
    .image-card:hover {
      transform: translateY(-4px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🐱 Admin Panel</h1>
      <p>Bekleyen kedi fotoğraflarını yönetin</p>
    </div>
    
    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="totalCount">-</div>
        <div class="stat-label" id="totalLabel">Bekleyen Fotoğraf</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat1">-</div>
        <div class="stat-label" id="stat1Label">Yüksek Güven</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat2">-</div>
        <div class="stat-label" id="stat2Label">Düşük Güven</div>
      </div>
    </div>
    
    <div class="tabs">
      <button id="pendingTab" class="tab-button active" onclick="switchTab('pending')">Bekleyen</button>
      <button id="allTab" class="tab-button" onclick="switchTab('all')">Tüm Resimler</button>
    </div>

    <div class="controls">
      <div>
        <button id="refreshBtn" onclick="loadCurrentImages()">🔄 Yenile</button>
        <button onclick="rebuildManifest()" class="btn-warning">🔧 Manifest Yenile</button>
      </div>
      <div id="bulkActions">
        <button onclick="approveAllHighConfidence()" class="btn-success">✅ Tüm Yüksek Güvenli Onayla</button>
        <button onclick="rejectAllLowConfidence()" class="btn-error">❌ Tüm Düşük Güvenli Reddet</button>
      </div>
    </div>
    
    <div id="statusMessage"></div>
    <div id="imagesContainer" class="images-grid"></div>
    <div id="paginationContainer" class="pagination" style="display: none;"></div>
  </div>

  <!-- Image Modal -->
  <div id="imageModal" class="image-modal">
    <div class="image-modal-content">
      <span class="image-modal-close" id="closeImageModal">&times;</span>
      <img id="modalImage" src="" alt="Full size image">
      <div class="image-modal-info">
        <div class="image-modal-filename" id="modalFilename"></div>
        <div class="image-modal-meta" id="modalMeta"></div>
      </div>
    </div>
  </div>

  <script>
    // === Config & small helpers ===
    const PAGE_LIMIT = 50;
    const CACHE_TTL_MS = 30_000; // client-side cache TTL
    const MAX_CONCURRENCY = 5;   // bulk actions

    const $ = (id) => document.getElementById(id);
    const idle = (cb) => (window.requestIdleCallback || ((fn)=>setTimeout(fn,1)))(cb);

    const ADMIN_TOKEN = prompt('Admin token girin:');
    if (!ADMIN_TOKEN) {
      document.body.innerHTML = '<div class="error">Admin token gerekli!</div>';
      // Stop script to avoid further errors
      throw new Error('Admin token gerekli');
    }

    // In-memory state
    let pendingImages = [];
    let allImages = [];
    let currentTab = 'pending';
    let currentPage = 1;
    let totalPages = 1;
    let paginationInfo = null;

    // Abort controllers to cancel inflight requests when switching tabs/pages
    const inflight = {
      pending: null,
      all: null,
      rebuild: null
    };

    // Simple sessionStorage-backed cache with TTL
    const cache = {
      get(key) {
        try {
          const raw = sessionStorage.getItem(key);
          if (!raw) return null;
          const { exp, data } = JSON.parse(raw);
          if (exp && exp < Date.now()) {
            sessionStorage.removeItem(key);
            return null;
          }
          return data;
        } catch { return null; }
      },
      set(key, data, ttl = CACHE_TTL_MS) {
        try {
          sessionStorage.setItem(key, JSON.stringify({ exp: Date.now() + ttl, data }));
        } catch {}
      }
    };

    // Debounce refresh button to avoid API spam
    (function attachRefreshDebounce(){
      const btn = $('refreshBtn');
      let lock = false;
      btn?.addEventListener('click', () => {
        if (lock) return;
        lock = true;
        setTimeout(()=> lock = false, 1000);
      });
    })();

    // === Image modal (unchanged visuals) ===
    function showImageModal(imageData) {
      const modal = $('imageModal');
      const modalImage = $('modalImage');
      const modalFilename = $('modalFilename');
      const modalMeta = $('modalMeta');

      const imageUrl = `https://medias.turkkedy.net/${encodeURIComponent(imageData.key)}`;
      modalImage.decoding = 'async';
      modalImage.loading = 'eager';
      modalImage.src = imageUrl;

      let filename, metaInfo;

      if (currentTab === 'pending') {
        filename = imageData.originalName;
        const uploadDate = new Date(imageData.uploadTime).toLocaleString('tr-TR');
        const fileSize = (imageData.size / 1024 / 1024).toFixed(1);
        const confidence = (imageData.confidence * 100).toFixed(1);
        const hasCat = imageData.hasCat ? 'Evet' : 'Hayır';

        metaInfo = `${uploadDate} • ${fileSize} MB • Güven: ${confidence}% • Kedi: ${hasCat}`;
        if (imageData.detectionMessage) {
          metaInfo += ` • ${imageData.detectionMessage}`;
        }
      } else {
        filename = imageData.key.split('/').pop() || imageData.key;
        const manifestStatus = imageData.inManifest ? 'Canlı (Manifest\'te)' : 'Canlı Değil (Manifest\'te Yok)';
        metaInfo = `${manifestStatus}`;
      }

      modalFilename.textContent = filename;
      modalMeta.textContent = metaInfo;

      modal.style.display = 'block';
      document.body.style.overflow = 'hidden';
    }
    function hideImageModal() {
      $('imageModal').style.display = 'none';
      document.body.style.overflow = 'auto';
    }
    $('closeImageModal').onclick = hideImageModal;
    $('imageModal').onclick = function(e) { if (e.target === this) hideImageModal(); };
    document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') hideImageModal(); }, { passive: true });

    // === Tabs (visuals identical) ===
    function switchTab(tab) {
      currentTab = tab;
      $('pendingTab').classList.toggle('active', tab === 'pending');
      $('allTab').classList.toggle('active', tab === 'all');
      $('bulkActions').style.display = tab === 'pending' ? 'block' : 'none';
      $('paginationContainer').style.display = tab === 'all' ? 'flex' : 'none';
      loadCurrentImages();
    }

    // === Network helpers ===
    function abortIfSet(controllerRef) {
      if (controllerRef.current) controllerRef.current.abort();
    }

    async function fetchJSON(url, controllerRef, options = {}) {
      abortIfSet(controllerRef);
      controllerRef.current = new AbortController();
      const signal = controllerRef.current.signal;

      const timeout = setTimeout(()=> controllerRef.current.abort(), 15_000); // 15s safety
      try {
        const res = await fetch(url, { ...options, signal });
        const data = await res.json().catch(()=> ({}));
        if (!res.ok) {
          throw new Error(data.error || `Request failed (${res.status})`);
        }
        return data;
      } finally {
        clearTimeout(timeout);
      }
    }

    // === Loaders with SWR cache ===
    async function loadPendingImages() {
      const cacheKey = `pending:${ADMIN_TOKEN}`;
      try {
        showStatus('Yükleniyor...', 'loading');

        // 1) Fast path: show cache if present
        const cached = cache.get(cacheKey);
        if (cached) {
          pendingImages = cached.images || [];
          updateStats();
          renderImages();
          hideStatus();
          // revalidate in the background
          idle(revalidate);
        } else {
          await revalidate();
        }

        async function revalidate() {
          const data = await fetchJSON(`/api/pending?token=${ADMIN_TOKEN}`, { current: inflight.pending }, {});
          pendingImages = data.images || [];
          cache.set(cacheKey, data);
          updateStats();
          renderImages();
          hideStatus();
        }
      } catch (error) {
        showStatus('Hata: ' + error.message, 'error');
        console.error('Error loading pending images:', error);
      }
    }

    async function loadAllImages(page = 1) {
      const cacheKey = `all:${ADMIN_TOKEN}:page:${page}:limit:${PAGE_LIMIT}`;
      try {
        showStatus('Yükleniyor...', 'loading');

        // 1) Fast path: cached page
        const cached = cache.get(cacheKey);
        if (cached) {
          consumeAllImagesResponse(cached);
          updateStats();
          renderImages();
          renderPagination();
          hideStatus();
          idle(revalidate);
        } else {
          await revalidate();
        }

        async function revalidate() {
          const data = await fetchJSON(`/api/admin/all-images?token=${ADMIN_TOKEN}&page=${page}&limit=${PAGE_LIMIT}`, { current: inflight.all });
          cache.set(cacheKey, data);
          consumeAllImagesResponse(data);
          updateStats();
          renderImages();
          renderPagination();
          hideStatus();

          // Prefetch next page in idle time for snappier UX
          if (paginationInfo?.hasNext) {
            const nextKey = `all:${ADMIN_TOKEN}:page:${page+1}:limit:${PAGE_LIMIT}`;
            idle(async () => {
              if (!cache.get(nextKey)) {
                try {
                  const next = await fetch(`/api/admin/all-images?token=${ADMIN_TOKEN}&page=${page+1}&limit=${PAGE_LIMIT}`).then(r=>r.ok?r.json():null).catch(()=>null);
                  if (next) cache.set(nextKey, next);
                } catch {}
              }
            });
          }
        }

        function consumeAllImagesResponse(data) {
          allImages = data.images || [];
          paginationInfo = data.pagination || null;
          currentPage = paginationInfo?.page || page;
          totalPages = paginationInfo?.totalPages || 1;
          if (data.stats && paginationInfo) {
            paginationInfo.stats = data.stats;
          }
        }
      } catch (error) {
        showStatus('Hata: ' + error.message, 'error');
        console.error('Error loading all images:', error);
      }
    }

    async function loadCurrentImages() {
      if (currentTab === 'pending') {
        await loadPendingImages();
      } else {
        await loadAllImages(1);
      }
    }

    async function rebuildManifest() {
      if (!confirm('Manifest dosyasını yeniden oluşturmak istediğinizden emin misiniz? Bu işlem biraz zaman alabilir.')) return;

      try {
        showStatus('Manifest yenileniyor...', 'loading');
        const data = await fetchJSON(`/api/admin/rebuild-manifest?token=${ADMIN_TOKEN}`, { current: inflight.rebuild });
        showStatus(`Manifest başarıyla yenilendi! ${data.count} resim eklendi.`, 'success');
        setTimeout(() => loadCurrentImages(), 1000);
      } catch (error) {
        showStatus('Hata: ' + error.message, 'error');
        console.error('Error rebuilding manifest:', error);
      }
    }

    // === Stats & Rendering (UI unchanged) ===
    function updateStats() {
      if (currentTab === 'pending') {
        const total = pendingImages.length;
        const highConfidence = pendingImages.filter(img => img.confidence >= 0.7).length;
        const lowConfidence = pendingImages.filter(img => img.confidence < 0.3).length;

        $('totalCount').textContent = total;
        $('totalLabel').textContent = 'Bekleyen Fotoğraf';
        $('stat1').textContent = highConfidence;
        $('stat1Label').textContent = 'Yüksek Güven';
        $('stat2').textContent = lowConfidence;
        $('stat2Label').textContent = 'Düşük Güven';
      } else {
        const total = paginationInfo ? paginationInfo.total : 0;
        const inManifest = paginationInfo && paginationInfo.stats ? paginationInfo.stats.inManifest || 0 : 0;
        const notInManifest = paginationInfo && paginationInfo.stats ? paginationInfo.stats.notInManifest || 0 : 0;

        $('totalCount').textContent = total;
        $('totalLabel').textContent = 'Toplam Resim';
        $('stat1').textContent = inManifest;
        $('stat1Label').textContent = 'Manifest\'te';
        $('stat2').textContent = notInManifest;
        $('stat2Label').textContent = 'Manifest\'te Değil';
      }
    }

    function renderImages() {
      const container = $('imagesContainer');
      const images = currentTab === 'pending' ? pendingImages : allImages;

      if (!images || images.length === 0) {
        container.className = currentTab === 'pending' ? 'images-grid' : 'images-list';
        container.innerHTML = `<div class="loading">${currentTab === 'pending' ? 'Bekleyen fotoğraf yok' : 'Resim bulunamadı'}</div>`;
        return;
      }

      if (currentTab === 'pending') {
        container.className = 'images-grid';
        container.innerHTML = images.map(img => {
          const imageUrl = `https://medias.turkkedy.net/${encodeURIComponent(img.key)}`;
          const uploadDate = new Date(img.uploadTime).toLocaleString('tr-TR');
          const fileSize = (img.size / 1024 / 1024).toFixed(1);

          return `
            <div class="image-card" onclick="showImageModal(${JSON.stringify(img).replace(/"/g, '&quot;')})">
              <img src="${imageUrl}"
                   class="image-preview"
                   alt="${img.originalName}"
                   loading="lazy"
                   decoding="async"
                   fetchpriority="low"
                   onerror="this.src='data:image/svg+xml,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;300&quot; height=&quot;200&quot; viewBox=&quot;0 0 300 200&quot;><rect width=&quot;300&quot; height=&quot;200&quot; fill=&quot;%231a1a1a&quot;/><text x=&quot;150&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; fill=&quot;%239aa0a6&quot; font-family=&quot;Arial&quot;>Resim Yüklenemedi</text></svg>'">
              <div class="image-info">
                <div class="image-filename">${img.originalName}</div>
                <div class="image-meta">
                  ${uploadDate} • ${fileSize} MB
                </div>
                <div class="confidence-badge confidence-${getConfidenceClass(img.confidence)}">
                  Güven: ${(img.confidence * 100).toFixed(1)}%
                </div>
                <div class="image-actions">
                  <button onclick="event.stopPropagation(); approveImage('${img.key}')" class="btn-success">✅ Onayla</button>
                  <button onclick="event.stopPropagation(); rejectImage('${img.key}')" class="btn-error">❌ Reddet</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } else {
        container.className = 'images-list';
        container.innerHTML = images.map(img => {
          const imageUrl = `https://medias.turkkedy.net/${encodeURIComponent(img.key)}`;
          const filename = img.key.split('/').pop() || img.key;
          const imgData = { key: img.key, inManifest: img.inManifest };

          return `
           <div class="image-list-item" onclick='showImageModal(${JSON.stringify(imgData)})'>
              <img src="${imageUrl}"
                   class="image-list-preview"
                   alt="${filename}"
                   loading="lazy"
                   decoding="async"
                   fetchpriority="low"
                   onerror="this.src='data:image/svg+xml,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;100&quot; height=&quot;70&quot; viewBox=&quot;0 0 100 70&quot;><rect width=&quot;100&quot; height=&quot;70&quot; fill=&quot;%231a1a1a&quot;/><text x=&quot;50&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; fill=&quot;%239aa0a6&quot; font-family=&quot;Arial&quot; font-size=&quot;12&quot;>?</text></svg>'">
              <div class="image-list-info">
                <div class="image-list-filename">${filename}</div>
                <div class="image-list-meta">
                  <span class="manifest-status manifest-${img.inManifest ? 'live' : 'not-live'}">
                    ${img.inManifest ? '🟢 Canlı' : '🔴 Canlı Değil'}
                  </span>
                </div>
              </div>
              <button onclick="event.stopPropagation(); deleteImage('${img.key}')" class="btn-error" style="padding: 4px 8px; font-size: 12px;">🗑️ Sil</button>
            </div>
          `;
        }).join('');
      }
    }

    function getConfidenceClass(confidence) {
      if (confidence >= 0.7) return 'high';
      if (confidence >= 0.3) return 'medium';
      return 'low';
    }

    function renderPagination() {
      const container = $('paginationContainer');

      if (currentTab === 'pending' || !paginationInfo) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'flex';

      const { page, totalPages, total, hasPrev, hasNext } = paginationInfo;
      const startItem = (page - 1) * PAGE_LIMIT + 1;
      const endItem = Math.min(page * PAGE_LIMIT, total);

      container.innerHTML = `
        <button onclick="loadAllImages(1)" ${!hasPrev ? 'disabled' : ''}>⏪</button>
        <button onclick="loadAllImages(${page - 1})" ${!hasPrev ? 'disabled' : ''}>⬅️</button>
        <span class="pagination-info">
          Sayfa ${page}/${totalPages} • ${startItem}-${endItem} / ${total}
        </span>
        <button onclick="loadAllImages(${page + 1})" ${!hasNext ? 'disabled' : ''}>➡️</button>
        <button onclick="loadAllImages(${totalPages})" ${!hasNext ? 'disabled' : ''}>⏩</button>
      `;
    }

    // === API actions (single & bulk) ===
    async function postApproval(action, key) {
      const res = await fetch(`/api/admin/approve?token=${ADMIN_TOKEN}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, key })
      });
      const data = await res.json().catch(()=> ({}));
      if (!res.ok) throw new Error(data.error || `${action} failed`);
      return data;
    }

    async function approveImage(key, opts = {}) {
      const { silent = false } = opts;
      try {
        if (!silent) showStatus('Onaylanıyor...', 'loading');
        await postApproval('approve', key);
        if (!silent) {
          showStatus('Fotoğraf onaylandı!', 'success');
          setTimeout(() => loadPendingImages(), 500);
        }
      } catch (error) {
        showStatus('Hata: ' + error.message, 'error');
        console.error('Error approving image:', error);
      }
    }

    async function rejectImage(key, opts = {}) {
      const { silent = false } = opts;
      try {
        if (!silent) {
          if (!confirm('Bu fotoğrafı reddetmek istediğinizden emin misiniz?')) return;
          showStatus('Reddediliyor...', 'loading');
        }
        await postApproval('reject', key);
        if (!silent) {
          showStatus('Fotoğraf reddedildi!', 'success');
          setTimeout(() => loadPendingImages(), 500);
        }
      } catch (error) {
        showStatus('Hata: ' + error.message, 'error');
        console.error('Error rejecting image:', error);
      }
    }

    // Concurrency-limited runner for bulk ops
    async function runWithConcurrency(items, limit, worker, progressLabel) {
      return new Promise((resolve) => {
        let i = 0, active = 0, done = 0;
        const total = items.length;

        const step = () => {
          while (active < limit && i < total) {
            const idx = i++;
            active++;
            worker(items[idx]).catch(()=>null).finally(() => {
              active--; done++;
              showStatus(`${progressLabel}: ${done}/${total}`, 'loading');
              if (done === total) resolve();
              else step();
            });
          }
        };
        step();
      });
    }

    async function approveAllHighConfidence() {
      const highConfidenceImages = pendingImages.filter(img => img.confidence >= 0.7);
      if (highConfidenceImages.length === 0) {
        showStatus('Onaylanacak yüksek güvenli fotoğraf yok', 'error');
        return;
      }
      if (!confirm(`${highConfidenceImages.length} yüksek güvenli fotoğrafı onaylamak istediğinizden emin misiniz?`)) return;

      showStatus('Toplu onaylanıyor...', 'loading');
      await runWithConcurrency(
        highConfidenceImages,
        MAX_CONCURRENCY,
        (img) => approveImage(img.key, { silent: true }),
        'Onaylanıyor'
      );
      showStatus('Tüm yüksek güvenli fotoğraflar onaylandı!', 'success');
      setTimeout(() => loadPendingImages(), 500);
    }

    async function rejectAllLowConfidence() {
      const lowConfidenceImages = pendingImages.filter(img => img.confidence < 0.3);
      if (lowConfidenceImages.length === 0) {
        showStatus('Reddedilecek düşük güvenli fotoğraf yok', 'error');
        return;
      }
      if (!confirm(`${lowConfidenceImages.length} düşük güvenli fotoğrafı reddetmek istediğinizden emin misiniz?`)) return;

      showStatus('Toplu reddediliyor...', 'loading');
      await runWithConcurrency(
        lowConfidenceImages,
        MAX_CONCURRENCY,
        (img) => rejectImage(img.key, { silent: true }),
        'Reddediliyor'
      );
      showStatus('Tüm düşük güvenli fotoğraflar reddedildi!', 'success');
      setTimeout(() => loadPendingImages(), 500);
    }

    async function deleteImage(key) {
      if (!confirm('Bu resmi kalıcı olarak silmek istediğinizden emin misiniz? Bu işlem geri alınamaz!')) return;

      try {
        showStatus('Siliniyor...', 'loading');
        const res = await fetch(`/api/admin/delete?token=${ADMIN_TOKEN}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key })
        });
        const data = await res.json().catch(()=> ({}));
        if (!res.ok) throw new Error(data.error || 'Delete failed');

        showStatus('Resim başarıyla silindi!', 'success');
        setTimeout(() => loadCurrentImages(), 500);
      } catch (error) {
        showStatus('Hata: ' + error.message, 'error');
        console.error('Error deleting image:', error);
      }
    }

    // === Status helpers ===
    function showStatus(message, type) {
      $('statusMessage').innerHTML = `<div class="${type}">${message}</div>`;
    }
    function hideStatus() {
      $('statusMessage').innerHTML = '';
    }

    // Initial load
    loadCurrentImages();
  </script>
</body>
</html>
