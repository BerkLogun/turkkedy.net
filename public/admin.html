<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Admin Panel • turkkedy.net</title>
  <style>
    :root { --bg:#0f1115; --fg:#e6e6e6; --muted:#9aa0a6; --btn:#1f232b; --btnh:#2a2f3a; --success:#06d6a0; --warning:#ffd166; --error:#f77f00; }
    * { box-sizing: border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #2b2f38;
    }
    
    .header h1 {
      margin: 0;
      font-size: 28px;
      color: var(--fg);
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: var(--btn);
      border: 1px solid #2b2f38;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    
    .stat-number {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .stat-label {
      color: var(--muted);
      font-size: 14px;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    button {
      background: var(--btn);
      color: var(--fg);
      border: 1px solid #2b2f38;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    
    button:hover { background: var(--btnh); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .btn-success { background: var(--success); color: #000; }
    .btn-success:hover { background: #05b88a; }
    
    .btn-warning { background: var(--warning); color: #000; }
    .btn-warning:hover { background: #e6bc5a; }
    
    .btn-error { background: var(--error); color: #fff; }
    .btn-error:hover { background: #e66f00; }
    
    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    
    .image-card {
      background: var(--btn);
      border: 1px solid #2b2f38;
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    
    .image-card:hover {
      border-color: var(--muted);
      transform: translateY(-2px);
    }
    
    .image-preview {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #1a1a1a;
    }
    
    .image-info {
      padding: 15px;
    }
    
    .image-filename {
      font-weight: 600;
      margin-bottom: 8px;
      word-break: break-all;
    }
    
    .image-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    
    .confidence-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .confidence-high { background: rgba(6,214,160,0.2); color: var(--success); }
    .confidence-medium { background: rgba(255,209,102,0.2); color: var(--warning); }
    .confidence-low { background: rgba(247,127,0,0.2); color: var(--error); }
    
    .image-actions {
      display: flex;
      gap: 8px;
    }
    
    .image-actions button {
      flex: 1;
      padding: 8px 12px;
      font-size: 12px;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
    
    .error {
      background: rgba(247,127,0,0.1);
      border: 1px solid var(--error);
      border-radius: 6px;
      padding: 15px;
      margin: 20px 0;
      color: var(--error);
    }
    
    .success {
      background: rgba(6,214,160,0.1);
      border: 1px solid var(--success);
      border-radius: 6px;
      padding: 15px;
      margin: 20px 0;
      color: var(--success);
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }
      
      .images-grid {
        grid-template-columns: 1fr;
      }
      
      .controls {
        flex-direction: column;
      }
      
      .controls button {
        width: 100%;
      }
    }
    
    /* Image Modal Styles */
    .image-modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.9);
      backdrop-filter: blur(4px);
    }
    
    .image-modal-content {
      position: relative;
      margin: auto;
      padding: 20px;
      width: 90%;
      height: 90%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .image-modal img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    .image-modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 2001;
      background: rgba(0,0,0,0.5);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    .image-modal-close:hover {
      background: rgba(0,0,0,0.8);
      transform: scale(1.1);
    }
    
    .image-modal-info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 15px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }
    
    .image-modal-filename {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    
    .image-modal-meta {
      font-size: 14px;
      color: #ccc;
    }
    
    .image-card {
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    
    .image-card:hover {
      transform: translateY(-4px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🐱 Admin Panel</h1>
      <p>Bekleyen kedi fotoğraflarını yönetin</p>
    </div>
    
    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="totalPending">-</div>
        <div class="stat-label">Bekleyen Fotoğraf</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="highConfidence">-</div>
        <div class="stat-label">Yüksek Güven</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="lowConfidence">-</div>
        <div class="stat-label">Düşük Güven</div>
      </div>
    </div>
    
    <div class="controls">
      <button onclick="loadPendingImages()">🔄 Yenile</button>
      <button onclick="approveAllHighConfidence()" class="btn-success">✅ Tüm Yüksek Güvenli Onayla</button>
      <button onclick="rejectAllLowConfidence()" class="btn-error">❌ Tüm Düşük Güvenli Reddet</button>
    </div>
    
    <div id="statusMessage"></div>
    <div id="imagesContainer" class="images-grid"></div>
  </div>

  <!-- Image Modal -->
  <div id="imageModal" class="image-modal">
    <div class="image-modal-content">
      <span class="image-modal-close" id="closeImageModal">&times;</span>
      <img id="modalImage" src="" alt="Full size image">
      <div class="image-modal-info">
        <div class="image-modal-filename" id="modalFilename"></div>
        <div class="image-modal-meta" id="modalMeta"></div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_TOKEN = prompt('Admin token girin:');
    if (!ADMIN_TOKEN) {
      document.body.innerHTML = '<div class="error">Admin token gerekli!</div>';
    }

    let pendingImages = [];

    // Image modal functions
    function showImageModal(imageData) {
      const modal = document.getElementById('imageModal');
      const modalImage = document.getElementById('modalImage');
      const modalFilename = document.getElementById('modalFilename');
      const modalMeta = document.getElementById('modalMeta');
      
      modalImage.src = `https://medias.turkkedy.net/${encodeURIComponent(imageData.key)}`;
      modalFilename.textContent = imageData.originalName;
      modalMeta.textContent = `${new Date(imageData.uploadTime).toLocaleString('tr-TR')} • ${(imageData.size / 1024 / 1024).toFixed(1)} MB • Güven: ${(imageData.confidence * 100).toFixed(1)}%`;
      
      modal.style.display = 'block';
      document.body.style.overflow = 'hidden'; // Prevent background scrolling
    }

    function hideImageModal() {
      const modal = document.getElementById('imageModal');
      modal.style.display = 'none';
      document.body.style.overflow = 'auto'; // Restore scrolling
    }

    // Event listeners for image modal
    document.getElementById('closeImageModal').onclick = hideImageModal;
    document.getElementById('imageModal').onclick = function(e) {
      if (e.target === this) {
        hideImageModal();
      }
    };

    // Close modal with Escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        hideImageModal();
      }
    });

    async function loadPendingImages() {
      try {
        showStatus('Yükleniyor...', 'loading');
        
        const response = await fetch(`/api/pending?token=${ADMIN_TOKEN}`);
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Failed to load pending images');
        }
        
        pendingImages = data.images;
        updateStats();
        renderImages();
        hideStatus();
        
      } catch (error) {
        showStatus('Hata: ' + error.message, 'error');
        console.error('Error loading pending images:', error);
      }
    }

    function updateStats() {
      const total = pendingImages.length;
      const highConfidence = pendingImages.filter(img => img.confidence >= 0.7).length;
      const lowConfidence = pendingImages.filter(img => img.confidence < 0.3).length;
      
      document.getElementById('totalPending').textContent = total;
      document.getElementById('highConfidence').textContent = highConfidence;
      document.getElementById('lowConfidence').textContent = lowConfidence;
    }

    function renderImages() {
      const container = document.getElementById('imagesContainer');
      
      if (pendingImages.length === 0) {
        container.innerHTML = '<div class="loading">Bekleyen fotoğraf yok</div>';
        return;
      }
      
      container.innerHTML = pendingImages.map(img => `
        <div class="image-card" onclick="showImageModal(${JSON.stringify(img).replace(/"/g, '&quot;')})">
          <img src="https://medias.turkkedy.net/${encodeURIComponent(img.key)}" 
               class="image-preview" 
               alt="${img.originalName}"
               onerror="this.src='data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"200\" viewBox=\"0 0 300 200\"><rect width=\"300\" height=\"200\" fill=\"%231a1a1a\"/><text x=\"150\" y=\"100\" text-anchor=\"middle\" fill=\"%239aa0a6\" font-family=\"Arial\">Resim Yüklenemedi</text></svg>'">
          <div class="image-info">
            <div class="image-filename">${img.originalName}</div>
            <div class="image-meta">
              ${new Date(img.uploadTime).toLocaleString('tr-TR')} • 
              ${(img.size / 1024 / 1024).toFixed(1)} MB
            </div>
            <div class="confidence-badge confidence-${getConfidenceClass(img.confidence)}">
              Güven: ${(img.confidence * 100).toFixed(1)}%
            </div>
            <div class="image-actions">
              <button onclick="event.stopPropagation(); approveImage('${img.key}')" class="btn-success">✅ Onayla</button>
              <button onclick="event.stopPropagation(); rejectImage('${img.key}')" class="btn-error">❌ Reddet</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function getConfidenceClass(confidence) {
      if (confidence >= 0.7) return 'high';
      if (confidence >= 0.3) return 'medium';
      return 'low';
    }

    async function approveImage(key) {
      try {
        showStatus('Onaylanıyor...', 'loading');
        
        const response = await fetch(`/api/admin/approve?token=${ADMIN_TOKEN}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'approve', key })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Approval failed');
        }
        
        showStatus('Fotoğraf onaylandı!', 'success');
        setTimeout(() => loadPendingImages(), 1000);
        
      } catch (error) {
        showStatus('Hata: ' + error.message, 'error');
        console.error('Error approving image:', error);
      }
    }

    async function rejectImage(key) {
      if (!confirm('Bu fotoğrafı reddetmek istediğinizden emin misiniz?')) {
        return;
      }
      
      try {
        showStatus('Reddediliyor...', 'loading');
        
        const response = await fetch(`/api/admin/approve?token=${ADMIN_TOKEN}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'reject', key })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Rejection failed');
        }
        
        showStatus('Fotoğraf reddedildi!', 'success');
        setTimeout(() => loadPendingImages(), 1000);
        
      } catch (error) {
        showStatus('Hata: ' + error.message, 'error');
        console.error('Error rejecting image:', error);
      }
    }

    async function approveAllHighConfidence() {
      const highConfidenceImages = pendingImages.filter(img => img.confidence >= 0.7);
      
      if (highConfidenceImages.length === 0) {
        showStatus('Onaylanacak yüksek güvenli fotoğraf yok', 'error');
        return;
      }
      
      if (!confirm(`${highConfidenceImages.length} yüksek güvenli fotoğrafı onaylamak istediğinizden emin misiniz?`)) {
        return;
      }
      
      try {
        showStatus('Toplu onaylanıyor...', 'loading');
        
        for (const img of highConfidenceImages) {
          await approveImage(img.key);
        }
        
        showStatus('Tüm yüksek güvenli fotoğraflar onaylandı!', 'success');
        
      } catch (error) {
        showStatus('Hata: ' + error.message, 'error');
      }
    }

    async function rejectAllLowConfidence() {
      const lowConfidenceImages = pendingImages.filter(img => img.confidence < 0.3);
      
      if (lowConfidenceImages.length === 0) {
        showStatus('Reddedilecek düşük güvenli fotoğraf yok', 'error');
        return;
      }
      
      if (!confirm(`${lowConfidenceImages.length} düşük güvenli fotoğrafı reddetmek istediğinizden emin misiniz?`)) {
        return;
      }
      
      try {
        showStatus('Toplu reddediliyor...', 'loading');
        
        for (const img of lowConfidenceImages) {
          await rejectImage(img.key);
        }
        
        showStatus('Tüm düşük güvenli fotoğraflar reddedildi!', 'success');
        
      } catch (error) {
        showStatus('Hata: ' + error.message, 'error');
      }
    }

    function showStatus(message, type) {
      const statusEl = document.getElementById('statusMessage');
      statusEl.innerHTML = `<div class="${type}">${message}</div>`;
    }

    function hideStatus() {
      const statusEl = document.getElementById('statusMessage');
      statusEl.innerHTML = '';
    }

    // Load images on page load
    loadPendingImages();
  </script>
</body>
</html>
