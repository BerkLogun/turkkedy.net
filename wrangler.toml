# Cloudflare Pages project "cats" (turkkedy.net)
# Bindings declared here are applied to the Pages project on every `wrangler pages deploy`.
# Secrets (ADMIN_TOKEN) are NOT stored here: set them with
#   npx wrangler pages secret put ADMIN_TOKEN --project-name cats
name = "cats"
compatibility_date = "2025-09-01"
pages_build_output_dir = "public"

[vars]
# Optional: Cloudflare Turnstile site key for the upload form (set TURNSTILE_SECRET as a secret to enforce it).
TURNSTILE_SITE_KEY = "0x4AAAAAAFUIZrCCKieDoMma"
# Public base URL of the R2 bucket (custom domain). Leave empty to serve via /r2/<key> (local dev).
CDN_BASE = "https://medias.turkkedy.net"

[[r2_buckets]]
binding = "cats"
bucket_name = "cats"          # public (medias.turkkedy.net)

[[r2_buckets]]
binding = "pending"
bucket_name = "cats-pending"  # private: uploads awaiting moderation

[[d1_databases]]
binding = "DB"
database_name = "turkkedy"
database_id = "2aa0308e-6d93-493d-ac10-477b56fbe451"
migrations_dir = "migrations"

[ai]
binding = "AI"
