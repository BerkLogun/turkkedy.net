name = "cat-site"
compatibility_date = "2024-10-01"   # or current
compatibility_flags = ["nodejs_compat"]

# Bind an R2 bucket named CATS (binding name in code), to your actual R2 bucket "cats"
[[r2_buckets]]
binding = "cats"
bucket_name = "cats"

# Pages config
[pages]
# folder with static assets
# (Cloudflare Pages will deploy /public and pick up /functions automatically)


[vars]
CDN_BASE = "https://medias.turkkedy.net"   # your R2 public/custom domain
SITE_BASE = "https://turkkedy.net" 